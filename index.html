<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="MatchDekho Live - live TV channel directory and sports viewing interface.">
<title>MatchDekho Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hdr">
  <div class="wrap">
    <a class="logo" href="#">MATCH<b>DEKHO</b><i></i></a>
  </div>
</header>

<div id='home'>
          <section class='hero' id='hero'>
            <div class='slide on'>
              <div class='bg'></div><div class='streak'></div><div class='shade'></div>
              <div class='emb'><div class='ring r1'>IND</div><u></u><div class='ring r2'>NZ</div></div>
              <div class='big'><span class='a'>India</span><span class='v'>VS</span><span class='b'>New Zealand</span></div>
              <div class='copy'>
                <span class='pill'><i></i>LIVE NOW</span>
                <h1>Watch Cricket Live</h1>
                <div class='sub'>India vs New Zealand</div>
                <button class='btn-watch' id='watchBtn' type='button'>&#9654; WATCH NOW</button>
              </div>
            </div>
          </section>
          <div class='wrap'>
            <a class='tg' href='https://t.me/match_dheko' rel='noopener' target='_blank'><svg viewBox='0 0 24 24' fill='#fff'><path d='M21.9 3.3 2.6 10.7c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.7-.8L23 4.8c.3-1.3-.5-1.9-1.1-1.5zM8.5 13.2l9.6-6c.5-.3.9-.1.5.2l-7.8 7-.3 3.3-2-4.5z'/></svg><span>Join Telegram Channel</span><em>&#8250;</em></a>
            <h2 class='sec'>Live TV Channels</h2>
            <input aria-label='Search live TV channels' autocomplete='off' class='chsearch' id='channelSearch' placeholder='Search channels (e.g. Sony Sports)...' type='search'/>
            <div class='chgrid' id='chlist'>
              <button class='ccard featured' data-name='Sony Sports Live' data-embed='https://allrounder3-0.pages.dev/cricket/sony-3' type='button'><div class='clogo'><div class='tenb'><i>LIVE</i><b>TV</b><em>HD</em></div></div><div class='cinfo'><div class='cname'>Sony Sports Live</div><div class='ccat'>Live Cricket</div></div></button>
              <button class='ccard' data-name='Sony TEN 3 HD' data-embed='https://premiumplugx.me/sliv/player.html?id=ten3-hd.sonyliv' type='button'><div class='clogo'><div class='tenb'><i>TEN</i><b>3</b><em>HD</em></div></div><div class='cinfo'><div class='cname'>Sony TEN 3 HD</div><div class='ccat'>Sports</div></div></button>
              <button class='ccard' data-name='Sony TEN 1 HD' data-embed='https://premiumplugx.me/sliv/player.html?id=ten1-hd.sonyliv' type='button'><div class='clogo'><div class='tenb'><i>TEN</i><b>1</b><em>HD</em></div></div><div class='cinfo'><div class='cname'>Sony TEN 1 HD</div><div class='ccat'>Sports</div></div></button>
            </div>
            <div class='status' id='chstatus'>Channels load ho rahe hain...</div>
            <div class='morewrap'><button class='wbtn hidden' id='moreBtn' type='button'>Aur channels dikhao</button></div>
          </div>
        </div>

        <div class='hidden' id='watch'>
          <div class='wrap'>
            <div class='wbar'>
              <button class='wbtn' id='backBtn' type='button'>&#8592; Back</button>
              <div class='wtitle' id='wtitle'>Sony TEN 3 HD</div>
              <button class='wbtn' id='fsBtn' type='button'>&#9974; Fullscreen</button>
            </div>
            <div class='servers hidden' id='servers'></div>
            <div class='player' id='player'>
              <div class='ph' id='ph'><div class='pl'>&#9654;</div><div id='phmsg'></div></div>
            </div>
            
          </div>
        </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
